name: V-SHAPE original graphics mobile verification
on:
  push:
    branches: [work/vshape-pixel-graphics-20261116]
permissions:
  contents: write
concurrency:
  group: vshape-pixel-graphics
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'ElrosBolger/V-Shape-Pro'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resize the original artwork and validate safe area
        run: |
          python -m pip install --disable-pip-version-check Pillow==13.0.0
          python scripts/resize-original-icon.py
      - name: Run isolated logic and data preservation tests
        run: node --test --test-reporter=spec tests/graphics.cjs
      - name: Install development-only Chromium test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/vshape-qa" --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/vshape-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test real mobile viewports, recovery, OAuth bypass and offline mode
        env:
          NODE_PATH: ${{ runner.temp }}/vshape-qa/node_modules
        run: node tests/mobile-graphics.cjs
      - name: Retain screenshots and exact results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vshape-original-graphics-mobile-checks
          path: verification/
          retention-days: 14
      - name: Save verified resized assets to the isolated work branch
        env:
          VSHAPE_WORK_BRANCH: ${{ github.ref_name }}
          VSHAPE_TESTED_SHA: ${{ github.sha }}
        run: |
          test "$VSHAPE_WORK_BRANCH" = "work/vshape-pixel-graphics-20261116"
          test "$(git ls-remote origin "refs/heads/$VSHAPE_WORK_BRANCH" | cut -f1)" = "$VSHAPE_TESTED_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-maskable-v2-192.png icon-maskable-v2-512.png verification/
          git commit -m "Save verified enlarged V-SHAPE icons and mobile test evidence"
          git push origin "HEAD:refs/heads/$VSHAPE_WORK_BRANCH"

let warmTicker=null;
function warmTimeFormat(sec){sec=Math.max(0,Math.ceil(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function warmIsTimed(x){return Number.isFinite(Number(x[1]))&&Number(x[1])>0}
function warmSeconds(a,x){
 const t=a.warmTimer;
 if(!t||t.step!==a.warm)return x[1];
 return t.running?Math.max(0,Math.ceil((t.ends-Date.now())/1000)):Math.max(0,t.remaining);
}
function warmView(){
 clearInterval(warmTicker);
 const a=state.active,d=days[a.day],x=d.mob[a.warm],timed=warmIsTimed(x);

 app.innerHTML=header('Riscaldamento · Giorno '+a.day,'Movimenti guidati, senza dolore e senza affaticamento.')+
 `<div class="card"><div class="row spread"><span class="pill">Passo ${a.warm+1}/${d.mob.length}</span><span class="pill">${x[1]} secondi indicativi</span></div><h2 style="margin-top:15px">${esc(x[0])}</h2><p>${esc(x[2])}</p>`+
 (timed?`<div class="tip" style="text-align:center"><div class="eyebrow">Timer esercizio</div><div class="timer" id="warm-clock" role="timer" aria-label="Tempo rimanente">${warmTimeFormat(sec)}</div><div class="grid"><button class="btn" onclick="warmAdjust(-10)">−10 s</button><button class="btn" onclick="warmAdjust(10)">+10 s</button><button class="btn" onclick="warmAdjust(-60)">−1 min</button><button class="btn" onclick="warmAdjust(60)">+1 min</button></div><button class="btn primary wide" style="margin-top:10px" onclick="warmToggle()">${t?.running?'⏸ Pausa':sec===0?'↻ Ricomincia':'▶ Inizia esercizio'}</button><button class="btn wide" onclick="warmReset()">Ripristina ${warmTimeFormat(x[1])}</button><p class="small muted">Il timer non passa automaticamente all'esercizio successivo. Puoi modificarlo anche durante il conteggio.</p></div>`:'')+
 `<div class="tip">Non serve eseguire stretching intenso prima dei pesi. I movimenti devono essere fluidi e confortevoli.</div><button class="btn primary wide" onclick="advanceWarm()">${a.warm===d.mob.length-1?'Vai ai pesi →':'Fatto · Prossimo →'}</button><button class="btn wide" onclick="skipWarm()">Salta riscaldamento (non consigliato)</button></div>`;
 if(timed&&t?.running){
  const step=a.warm;
  const update=()=>{
   if(!state.active||state.active.stage!=='warm'||state.active.warm!==step){clearInterval(warmTicker);return}

function warmAdjust(delta){
 const a=state.active,x=days[a.day].mob[a.warm],sec=Math.max(0,Math.min(10800,warmSeconds(a,x)+delta)),running=a.warmTimer?.step===a.warm&&a.warmTimer.running&&sec>0;
 a.warmTimer={step:a.warm,running,remaining:sec,ends:running?Date.now()+sec*1000:null};save();warmView();

/* Adaptive progression: conservative, explainable, read-only until approved. */
function progRange(ex){const m=String(ex.reps).match(/(\d+)\s*[–-]\s*(\d+)/);return m?[+m[1],+m[2]]:[8,12]}
function progNumber(v){const n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?n:NaN}
function progRir(v){return v==='4+'?4:progNumber(v)}
function progSessions(day,week,index){
 const ex=days[day]?.ex[index];if(!ex)return [];
 const name=week<=4?ex.name:ex.alt;
 return state.records.filter(r=>r.day===day&&(r.week<=4)===(week<=4))
 .map(r=>({date:r.date,sets:r.entries.filter(x=>x.exercise===name)}))
 .filter(r=>r.sets.length>=ex.sets).sort((a,b)=>new Date(b.date)-new Date(a.date));
}
function progAssess(day,week,index){
 const ex=days[day]?.ex[index];if(!ex)return null;
 const sessions=progSessions(day,week,index),[low,high]=progRange(ex);
 const latest=sessions[0],prev=sessions[1];
 const valid=x=>x.sets.length===ex.sets&&x.sets.every(z=>Number.isFinite(progNumber(z.kg))&&Number.isFinite(progRir(z.rir))&&Number.isInteger(Number(z.reps)));
 if(!latest||!valid(latest))return {kind:'baseline',title:'Costruisci il riferimento',detail:'Servono serie complete con peso, ripetizioni e RIR per formulare una proposta.',sessions:sessions.length};
 const weights=latest.sets.map(z=>progNumber(z.kg)),same=weights.every(w=>w===weights[0]),kg=weights[0];
 const ready= same&&latest.sets.every(z=>Number(z.reps)>=high&&progRir(z.rir)>=2);
 const hard=latest.sets.filter(z=>progRir(z.rir)<=1||Number(z.reps)<low).length>=2;
 const previousReady=prev&&valid(prev)&&prev.sets.every(z=>progNumber(z.kg)===kg&&Number(z.reps)>=high&&progRir(z.rir)>=2);
 const previousHard=prev&&valid(prev)&&prev.sets.filter(z=>progRir(z.rir)<=1||Number(z.reps)<low).length>=2;
 if(ready&&previousReady)return {kind:'increase',title:'Aumento valutabile',detail:'Due sedute complete al limite alto del range con almeno 2 RIR e carico costante. Se la tecnica è solida, valuta il minimo incremento disponibile (indicativamente 2–5%).',kg,sessions:sessions.length};
 if(ready)return {kind:'hold',title:'Conferma ancora una volta',detail:'Hai raggiunto il limite alto del range: ripetilo nella prossima seduta con buona tecnica prima di aumentare il peso.',kg,sessions:sessions.length};
 if(hard&&previousHard)return {kind:'review',title:'Controlla recupero e carico',detail:'Difficoltà rilevata in due sedute. Verifica tecnica, sonno e recupero; se necessario riduci leggermente il peso. Nessuna riduzione automatica.',kg,sessions:sessions.length};
 return {kind:'hold',title:'Consolida il carico',detail:'Mantieni il peso e cerca progressivamente più ripetizioni con tecnica stabile e circa 2 RIR.',kg,sessions:sessions.length};
}
function progKey(day,week,index){return day+':'+(week<=4?'1':'2')+':'+index}
function progAdvice(day,week,index){
 const a=progAssess(day,week,index);if(!a)return '';
 const key=progKey(day,week,index),approved=state.progressionApprovals?.[key];
 return '<div class="card"><div class="eyebrow">Sistema · Progressione</div><h3>'+esc(a.title)+'</h3><p class="subtle">'+esc(a.detail)+'</p>'+(a.kind==='increase'?'<p class="small muted">Carico attuale: '+esc(a.kg)+' kg. Imposta tu il nuovo peso secondo gli scatti della macchina.</p><button class="btn smallbtn" onclick="progApprove(\''+day+'\','+week+','+index+')">'+(approved?'✓ Suggerimento preso in carico':'Approva suggerimento')+'</button>':'')+'</div>';
}
function progApprove(day,week,index){
 const a=progAssess(day,week,index);if(a?.kind!=='increase')return;

function progressionView(){

 const review=state.week===4||state.week===8;

 '<div class="card hero"><h2>Settimana '+state.week+' / 8</h2><p class="subtle">'+(review?'Fine blocco: valuta i risultati e decidi se mantenere o adattare la scheda.':'La struttura degli esercizi resta stabile. Le proposte sui carichi richiedono conferma.')+'</p><p class="small muted">RIR è una stima. La tecnica e il recupero contano più di una singola prestazione.</p></div>'+
 all.map(x=>'<div class="card"><div class="eyebrow">Giorno '+x.day+'</div><h3>'+esc(x.name)+'</h3><b>'+esc(x.a.title)+'</b><p class="subtle">'+esc(x.a.detail)+'</p><p class="small muted">'+x.a.sessions+' sedute complete nel blocco</p>'+(x.a.kind==='increase'?'<button class="btn smallbtn" onclick="progApprove(\''+x.day+'\','+state.week+','+x.index+')">'+(state.progressionApprovals?.[progKey(x.day,state.week,x.index)]?'✓ Preso in carico':'Approva suggerimento')+'</button>':'')+'</div>').join('')+
 '<button class="btn wide" onclick="home()">Torna al programma</button>';

function ageAt(birth,at=new Date()){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(birth||''))return null;
 const [y,m,d]=birth.split('-').map(Number),dob=new Date(y,m-1,d);
 if(dob.getFullYear()!==y||dob.getMonth()!==m-1||dob.getDate()!==d||dob>at)return null;
 let years=at.getFullYear()-y;
 if(at.getMonth()+1<m||(at.getMonth()+1===m&&at.getDate()<d))years--;
 return years>=0&&years<=120?years:null;
}

const SPOTIFY_CLIENT_ID='e4bf48bde1f54dfeb8ebcaa7d9cc7b6c';

const SPOTIFY_SCOPES='user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative';
const spStore='vshape_spotify_';
// Persistent authorization; transient OAuth PKCE secrets stay in session storage.
const spGet=k=>(k==='verifier'||k==='state'?sessionStorage:localStorage).getItem(spStore+k);
const spSet=(k,v)=>(k==='verifier'||k==='state'?sessionStorage:localStorage).setItem(spStore+k,String(v));
const spClear=()=>{['access','refresh','expires'].forEach(k=>localStorage.removeItem(spStore+k));['verifier','state'].forEach(k=>sessionStorage.removeItem(spStore+k))};
// Migrate existing credentials without asking for another Spotify consent.
for(const k of ['access','refresh','expires']){
 try{if(!localStorage.getItem(spStore+k)&&sessionStorage.getItem(spStore+k))localStorage.setItem(spStore+k,sessionStorage.getItem(spStore+k));sessionStorage.removeItem(spStore+k)}catch(e){console.warn('Spotify credential migration:',e)}
}
const spEscape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function spLogin(){
 try{
  const verifier=Array.from(crypto.getRandomValues(new Uint8Array(64)),b=>('0'+b.toString(16)).slice(-2)).join('');
  const challengeBytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
  const challenge=btoa(String.fromCharCode(...new Uint8Array(challengeBytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const stateValue=crypto.randomUUID();
  spSet('verifier',verifier);spSet('state',stateValue);
  const params=new URLSearchParams({response_type:'code',client_id:SPOTIFY_CLIENT_ID,scope:SPOTIFY_SCOPES,redirect_uri:SPOTIFY_REDIRECT,state:stateValue,code_challenge_method:'S256',code_challenge:challenge});
  location.assign('https://accounts.spotify.com/authorize?'+params.toString());
 }catch(e){spMessage='Impossibile avviare Spotify: '+e.message;musicView()}
}
async function spToken(body){

async function spAuthCallback(){

 try{
  if(params.has('error'))throw Error(params.get('error'));

let spRefreshInFlight=null;
async function spAccess(){

 if(token&&Date.now()<Number(spGet('expires')||0)-60000)return token;
 if(!spGet('refresh'))throw Error('Collega Spotify una volta per attivare il rinnovo automatico.');
 if(!spRefreshInFlight){
  spRefreshInFlight=spToken({grant_type:'refresh_token',refresh_token:spGet('refresh'),client_id:SPOTIFY_CLIENT_ID})
   .catch(e=>{if(/invalid_grant|revoked/i.test(e.message||'')){spClear();spMessage='Autorizzazione Spotify scaduta o revocata. Ricollega il tuo account.'}throw e})

async function spApi(path,method='GET',body){

 const results=await Promise.allSettled([spApi('me/player'),spApi('me/player/devices'),spApi('me/playlists?limit=30')]);

function spTime(ms){const t=Math.max(0,Math.floor((Number(ms)||0)/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}

/* Update only the music screen; never interrupt exercise entry or rest timers. */
let spPolling=false;
let spLastSignature='';
function spSignature(){
 return JSON.stringify({
  track:spCurrent?.item?.id||null,
  playing:spCurrent?.is_playing??null,
  device:spCurrent?.device?.id||null,
  volume:spCurrent?.device?.volume_percent??null,
  progress:spCurrent?.progress_ms??null,
  devices:spDevices.map(d=>[d.id,d.is_active,d.volume_percent]),
  playlists:spPlaylists.map(p=>p?.id),
  message:spMessage
 });
}
function spEnsureAutoRefresh(){
 if(spTimer)return;
 spTimer=setInterval(spAutoRefresh,7000);
}
async function spAutoRefresh(){
 if(spPolling||document.hidden||!(spGet('access')||spGet('refresh')))return;
 if(document.activeElement?.matches('#spotify-panel input, #spotify-panel select'))return;
 spPolling=true;
 try{
  const results=await Promise.allSettled([spApi('me/player'),spApi('me/player/devices')]);
  if(results[0].status==='fulfilled'&&Date.now()>spSeekPendingUntil){spCurrent=results[0].value;spProgressAt=Date.now();spUpdateMini();}
  if(results[1].status==='fulfilled')spDevices=results[1].value?.devices||[];
  const next=spSignature();
  if(document.getElementById('spotify-panel')&&next!==spLastSignature){
   spLastSignature=next;
   const position=window.scrollY;
   musicView();
   window.scrollTo(0,position);
  }
 }catch(e){/* Keep the current player visible if Spotify is temporarily unreachable. */}
 finally{spPolling=false}
}

(function initBackToTop(){

 let pending=false;
 function update(){
  pending=false;
  const rect=button.getBoundingClientRect();
  const pad=10;
  const blocked=[...document.querySelectorAll('#app button, #app input, #app select, #app textarea, #app a, #app [role="button"]')]
   .some(el=>{
    if(el.closest('.nav')||el.disabled)return false;
    const r=el.getBoundingClientRect();
    if(!r.width||!r.height)return false;
    return rect.left<r.right+pad&&rect.right>r.left-pad&&rect.top<r.bottom+pad&&rect.bottom>r.top-pad;
   });
  button.classList.toggle('visible',window.scrollY>320&&!blocked);
 }
 function schedule(){if(!pending){pending=true;requestAnimationFrame(update)}}
 window.addEventListener('scroll',schedule,{passive:true});
 window.addEventListener('resize',schedule,{passive:true});
 const appRoot=document.getElementById('app');
 if(appRoot)new MutationObserver(schedule).observe(appRoot,{childList:true,subtree:true});
 schedule();
})();

/* Android system Back gesture: internal page history, then exit only from first screen. */
(function installInternalNavigation(){
 const routes={home:()=>home(),preview:arg=>preview(arg),warmView:()=>warmView(),trainView:()=>trainView(),restView:()=>restView(),coolView:()=>coolView(),historyView:()=>historyView(),calendarView:()=>calendarView(),progressionView:()=>progressionView(),settingsView:()=>settingsView(),musicView:()=>musicView(),openCompletedWorkout:arg=>openCompletedWorkout(arg.day,arg.week)};
 const routeFns=['home','preview','warmView','trainView','restView','coolView','historyView','calendarView','progressionView','settingsView','musicView','openCompletedWorkout'];
 let restoring=false,current='home',currentArg=null;
 const syncBack=()=>{const b=document.getElementById('internal-back');if(b)b.hidden=current==='home'};
 const makeState=(route,arg)=>({vsInternal:true,route,arg:arg??null});
 try{window.history.replaceState(makeState('home',null),'',location.href)}catch(e){return}
 for(const name of routeFns){
  const original=window[name];
  if(typeof original!=='function')continue;
  window[name]=function(...args){
   const result=original.apply(this,args);
   if(!restoring){
    const arg=name==='preview'?args[0]:name==='openCompletedWorkout'?{day:args[0],week:args[1]}:null;
    if(current!==name||JSON.stringify(currentArg)!==JSON.stringify(arg)){
     current=name;currentArg=arg;syncBack();
     window.history.pushState(makeState(name,arg),'',location.href);
    }
   }
   return result;
  };
 }
 window.addEventListener('popstate',event=>{
  const route=event.state?.vsInternal?event.state.route:'home';
  const arg=event.state?.arg??null;
  restoring=true;
  try{
   document.getElementById('app-menu')?.setAttribute('hidden','');
   document.getElementById('menu-toggle')?.setAttribute('aria-expanded','false');
   (routes[route]||routes.home)(arg);
   current=route;currentArg=arg;syncBack();
   window.scrollTo(0,0);
  }finally{restoring=false}
 });
})();

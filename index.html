border:0}.exercise strong{display:block}.exercise .small{color:var(--muted)}input,select{width:100%;background:#0e1a2b;color:var(--ink);border:1px solid #42556e;border-radius:11px;padding:12px;min-width:0}label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}.timer{font-size:64px;line-height:1.15;font-variant-numeric:tabular-nums;font-weight:850;text-align:center;color:var(--accent);margin:12px 0}.tip{border:1px solid #3c8d85;background:#143a3b;padding:14px;border-radius:14px;margin:12px 0}.warn{border-color:#a77b3e;background:#3b3024}.nav{position:fixed;bottom:0;left:0;right:0;background:#0d1828ed;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px 12px max(10px,env(safe-area-inset-bottom))}.nav button{flex:1;max-width:210px;font-size:12px;padding:10px 4px}.check{color:var(--accent)}.hint{color:var(--amber)}.compact{margin:0}.week{display:flex;gap:8px;flex-wrap:wrap}.week button{min-width:42px}.week button.selected{background:var(--accent);color:#09231f}.subtle{font-size:13px;color:var(--muted)}.section{margin-top:24px}.count{font-size:12px;color:var(--muted)}@media(min-width:600px){.wrap{padding-top:28px}.timer{font-size:76px}}

.calendar-fab{position:fixed;right:14px;bottom:18px;z-index:10;background:#2563eb;color:white;border:0;border-radius:999px;padding:13px 17px;font-weight:700;box-shadow:0 6px 25px #0008;cursor:pointer}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0}.calcell{min-height:43px;border-radius:9px;background:#18253b;color:#e5eefb;border:1px solid #30445e;font-size:14px;cursor:pointer}.calcell.done{border-color:#22c55e;background:#164337}.calcell.today{outline:2px solid #38bdf8}.calcell.selected{background:#2858a1}.calcell.blank{background:transparent;border:0}.calhead{text-align:center;font-size:12px;color:#94a3b8}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">V-SHAPE <b>PRO</b></div><div class="small muted">Ipertrofia equilibrata · 3 giorni</div></div><span class="pill">8 settimane</span></header><main id="app"></main></div><nav class="nav"><button class="btn" onclick="home()">⌂ Programma</button><button class="btn" onclick="calendarView()">▦ Calendario</button><button class="btn" onclick="historyView()">▤ Diario</button><button class="btn" onclick="settingsView()">⚙ Dati</button><button class="btn" onclick="musicView()">♫ Musica</button></nav><script>
'use strict';
const STORE='vshape_final_v1';const initial={week:1,loads:{},records:[],active:null,measurements:{},measurementHistory:[],profile:{},warmDone:{}};
let state;try{state={...initial,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{state={...initial}};
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch{alert('Memoria locale piena: esporta il backup.')}};
const app=document.getElementById('app');
const E=(name,sets,reps,rest,alt,tip,load='',rir='2',note='')=>({name,sets,reps,rest,alt,tip,load,rir,note});
const days={
A:{name:'Dorso · Spalle · Bicipiti',desc:'Priorità larghezza e controllo scapolare',mob:[['Camminata o cyclette',240,'Ritmo facile: respiri più velocemente, ma puoi parlare.'],['Circonduzioni delle spalle',45,'10 rotazioni lente avanti e 10 indietro, senza dolore.'],['Rotazioni toraciche in quadrupedia',60,'Mano dietro la nuca: ruota il gomito verso il soffitto, 6 per lato.'],['Scapular pull alla lat machine leggera',60,'Braccia quasi distese: abbassa le scapole senza piegare molto i gomiti.'],['Avvicinamento alla lat machine',180,'2 serie leggere: circa 50% × 10 e 70% × 5 del carico allenante. Non a cedimento.']],cool:[['Allungamento dorsale assistito',35,'Appoggia le mani a un supporto e porta delicatamente il busto indietro.'],['Pettorale alla porta',35,'Avambraccio appoggiato, ruota piano il busto, senza forzare.'],['Avambraccio e polso',35,'Braccio disteso, accompagna delicatamente le dita indietro.']],ex:[
E('Lat machine avanti',3,'8–12',150,'Lat pulldown con poggiapetto','Regola sedile e blocco cosce; gomiti verso i fianchi.','45–50'),
E('Seated row con poggiapetto',3,'8–12',150,'Rematore macchina con supporto toracico','Torace appoggiato, tira verso le costole senza slanci.','54'),
E('High row / pulldown con poggiapetto',2,'10–12',120,'Lat machine presa neutra','Tira le maniglie dall’alto verso il basso, senza inarcare la schiena.'),
E('Alzate laterali ai cavi',3,'12–20',90,'Alzate laterali manubri','Gomiti morbidi, sali fino a circa altezza spalle.','5–7,5'),
E('Reverse pec deck',2,'12–20',75,'Croci inverse ai cavi','Controlla il movimento senza stringere il collo.'),
E('Curl manubri alternati',2,'8–12',90,'Curl ai cavi','Gomiti fermi, nessuno slancio.','10'),
E('Hammer curl',2,'10–15',75,'Curl martello alla corda','Presa neutra, polsi allineati.')
]},
B:{name:'Gambe · Core · Tricipiti',desc:'Seduta completa per la parte inferiore',mob:[['Cyclette o camminata',240,'Ritmo facile, aumenta gradualmente.'],['Mobilità caviglie al muro',60,'Ginocchio avanti verso il muro senza staccare il tallone: 8 per lato.'],['Squat a corpo libero assistito',60,'Tieniti a un supporto: 8 ripetizioni lente entro un’ampiezza comoda.'],['Ponte glutei',45,'10 ripetizioni, espira salendo, evita di inarcare la schiena.'],['Avvicinamento alla leg press',180,'2–3 serie progressive leggere; non contano nelle serie allenanti.']],cool:[['Flessori dell’anca',40,'Affondo in ginocchio con bacino leggermente retroverso, 20 s per lato.'],['Quadricipite',40,'In piedi con supporto, porta delicatamente il tallone al gluteo, 20 s per lato.'],['Polpaccio al muro',40,'Tallone a terra, 20 s per lato.']],ex:[
E('Leg press 45°',3,'8–12',180,'Hack squat guidato','Schiena stabile, ginocchia nella direzione dei piedi; non staccare il bacino.'),
E('Romanian deadlift con manubri',2,'8–12',150,'Hip hinge alla Smith','Ginocchia leggermente flesse, spingi le anche indietro; schiena neutra. Impara prima la tecnica.'),
E('Leg extension',2,'10–15',90,'Leg extension unilaterale','Movimento controllato, senza slancio.'),
E('Leg curl seduto',3,'10–15',90,'Leg curl sdraiato','Bacino fermo, rallenta il ritorno.'),
E('Calf raise alla macchina',3,'10–15',75,'Calf raise alla leg press','Pausa breve in basso e in alto, movimento completo.'),
E('Pushdown tricipiti corda',3,'10–15',90,'Pushdown barra','Gomiti vicini ai fianchi; apri appena la corda senza torcere i polsi.','18'),
E('Crunch ai cavi',2,'10–15',75,'Crunch a terra','Fletti il busto senza tirare con le braccia.')
]},
C:{name:'Petto · Upper · Richiamo gambe',desc:'Secondo stimolo dorso/spalle e richiamo inferiore',mob:[['Camminata o ellittica',240,'Ritmo leggero, senza affaticarti.'],['Circonduzioni braccia',45,'Piccoli cerchi che diventano gradualmente più ampi.'],['Rotazioni toraciche',60,'6 ripetizioni per lato, senza forzare.'],['Wall slides',60,'Avambracci contro il muro, scorri lentamente verso l’alto senza dolore.'],['Avvicinamento panca inclinata',180,'2–3 serie progressive leggere, senza cedimento.']],cool:[['Pettorale alla porta',40,'20 secondi per lato, tensione lieve.'],['Dorsale con supporto',40,'Respira e mantieni una tensione comoda.'],['Gluteo da seduto',40,'Caviglia su ginocchio opposto, inclina leggermente il busto, 20 s per lato.']],ex:[
E('Panca inclinata guidata 15–30°',3,'8–10',180,'Panca inclinata manubri','Mantieni scapole stabili; registra i kg per lato e considera la macchina.','25/lato'),
E('Chest press piana',2,'8–12',150,'Chest press convergente','Controlla discesa, evita rimbalzi.','54'),
E('Lat machine presa neutra',3,'10–12',120,'High row con poggiapetto','Gomiti verso i fianchi, evita di oscillare.','45–50'),
E('Alzate laterali manubri',3,'12–20',90,'Alzate laterali ai cavi','Carico che consenta controllo; niente slanci.','5–7,5'),
E('Leg press leggera / moderata',2,'10–15',120,'Split squat assistito','Richiamo gambe: 2–3 ripetizioni in riserva.'),
E('Leg curl seduto',2,'12–15',90,'Leg curl sdraiato','Controlla la fase di ritorno.'),
E('Estensioni tricipiti sopra la testa ai cavi',3,'10–15',90,'Estensioni unilaterali ai cavi','Gomiti comodi e fermi; non forzare le spalle.'),
E('Wrist curl',2,'12–20',60,'Reverse wrist curl','Avambracci appoggiati, polsi controllati.')
]}};
function blockEx(e){return state.week<=4?e.name:e.alt}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function header(title,sub){return `<div class="eyebrow">V-Shape Pro · Settimana ${state.week}/8</div><h1>${title}</h1><p class="muted">${sub}</p>`}
function home(){const a=state.active;app.innerHTML=header('Allenati per crescere','Progressione misurabile, mobilità guidata e recupero intelligente.')+`<div class="card hero"><div class="eyebrow">Blocco ${state.week<=4?'1 · Base stabile':'2 · Varianti controllate'}</div><h2>Seleziona la settimana</h2><div class="week">${Array.from({length:8},(_,i)=>`<button class="btn smallbtn ${state.week===i+1?'selected':''}" onclick="setWeek(${i+1})">${i+1}</button>`).join('')}</div><p class="subtle">Settimane 1–4: movimenti di riferimento. Settimane 5–8: alcune varianti; ricalibra i carichi senza perdere tecnica.</p></div>`+(a?`<div class="tip"><b>Seduta in corso: ${a.day}</b><p>Puoi riprendere da dove eri rimasto.</p><button class="btn primary" onclick="resume()">Riprendi seduta</button></div>`:'')+Object.entries(days).map(([k,d])=>`<div class="card"><div class="eyebrow">Giorno ${k}</div><h2>${d.name}</h2><p class="muted">${d.desc}</p><div class="row spread"><span class="pill">${d.ex.reduce((n,e)=>n+e.sets,0)} serie allenanti</span><span class="pill">~65–85 min + mobilità</span></div><div class="row" style="margin-top:14px"><button class="btn" onclick="preview('${k}')">Vedi esercizi</button><button class="btn primary" onclick="begin('${k}')">Inizia →</button></div></div>`).join('')+`<div class="card"><h3>Regole di progressione</h3><p class="subtle">Lascia circa 2 ripetizioni in riserva (RIR) nella maggior parte delle serie. Quando completi tutte le serie al limite alto del range con tecnica solida e RIR previsto, aumenta il peso dello scatto minimo la volta successiva. Non è obbligatorio arrivare al cedimento.</p><p class="subtle">Distribuzione consigliata: lunedì A, mercoledì B, venerdì C. Se il recupero è insufficiente, riduci 1–2 serie prima di aumentare il volume.</p></div>`}
function setWeek(n){if(state.active&&!confirm('Hai una seduta in corso. Cambiare settimana non modifica questa seduta. Continuare?'))return;state.week=n;save();home()}
function preview(k){let d=days[k];app.innerHTML=header('Giorno '+k,d.name)+`<div class="card"><h3>Preparazione guidata</h3>${d.mob.map(x=>`<div class="exercise"><strong>${esc(x[0])} · ${Math.ceil(x[1]/60)} min circa</strong><div class="small">${esc(x[2])}</div></div>`).join('')}</div><div class="card"><h3>Serie allenanti</h3>${d.ex.map((e,i)=>`<div class="exercise"><strong>${i+1}. ${esc(blockEx(e))}</strong><div class="small">${e.sets} × ${e.reps} · ${e.rest}s recupero · RIR ~${e.rir}${e.load?' · riferimento '+esc(e.load)+' kg':''}</div><div class="small">${esc(e.note)}</div></div>`).join('')}</div><button class="btn primary wide" onclick="begin('${k}')">Avvia giorno ${k}</button><button class="btn wide" onclick="home()">Torna al programma</button>`}
function begin(k){if(state.active&&!confirm('Sostituire la seduta non conclusa? I dati di quella seduta andranno persi.'))return;state.active={day:k,week:state.week,stage:'warm',warm:0,ex:0,set:0,entries:[],started:new Date().toISOString(),restEnd:null};save();resume()}
function resume(){let a=state.active;if(!a)return home();if(a.stage==='warm')warmView();else if(a.stage==='train')trainView();else if(a.stage==='rest')restView();else if(a.stage==='cool')coolView()}
function warmView(){let a=state.active,d=days[a.day],x=d.mob[a.warm];app.innerHTML=header('Riscaldamento · Giorno '+a.day,'Movimenti guidati, senza dolore e senza affaticamento.')+`<div class="card"><div class="row spread"><span class="pill">Passo ${a.warm+1}/${d.mob.length}</span><span class="pill">${x[1]} secondi indicativi</span></div><h2 style="margin-top:15px">${esc(x[0])}</h2><p>${esc(x[2])}</p><div class="tip">Non serve eseguire stretching intenso prima dei pesi. I movimenti devono essere fluidi e confortevoli.</div><button class="btn primary wide" onclick="advanceWarm()">${a.warm===d.mob.length-1?'Vai ai pesi →':'Fatto · Prossimo →'}</button><button class="btn wide" onclick="skipWarm()">Salta riscaldamento (non consigliato)</button></div>`}
function advanceWarm(){let a=state.active;if(++a.warm>=days[a.day].mob.length){a.stage='train'}save();resume()}
function skipWarm(){if(confirm('Vuoi saltare la preparazione? Esegui comunque almeno le serie di avvicinamento prima dei carichi impegnativi.')){state.active.stage='train';save();resume()}}
function key(a){return `${a.day}:${a.week}:${a.ex}:${a.set}`}
function previousLoad(a){let e=days[a.day].ex[a.ex];return state.loads[`${a.day}:${a.week<=4?'1':'2'}:${a.ex}`]??e.load??''}
function trainView(){let a=state.active,d=days[a.day],e=d.ex[a.ex],last=a.set===e.sets-1,next=d.ex[a.ex+1];app.innerHTML=header('Giorno '+a.day+' · '+d.name,`Esercizio ${a.ex+1}/${d.ex.length} · Serie ${a.set+1}/${e.sets}`)+`<div class="bar"><i style="width:${Math.round((a.ex+a.set/e.sets)/d.ex.length*100)}%"></i></div><div class="card hero"><div class="eyebrow">${last?'Ultima serie di questo esercizio':'Serie allenante'}</div><h1>${esc(a.week<=4?e.name:e.alt)}</h1><div class="row"><span class="pill">${e.reps} rip.</span><span class="pill">RIR ~${e.rir}</span><span class="pill">${e.rest}s recupero</span></div><p class="muted">${esc(e.note)}</p></div><div class="card"><div class="grid"><div><label for="kg">Peso (kg; per lato se indicato)</label><input id="kg" type="text" inputmode="decimal" placeholder="Es. 45" value="${esc(previousLoad(a))}"></div><div><label for="reps">Ripetizioni completate</label><input id="reps" type="number" min="1" max="100" placeholder="Es. 10"></div></div><div style="margin-top:10px"><label for="rir">Ripetizioni in riserva (RIR)</label><select id="rir"><option value="2">2 · obiettivo</option><option value="3">3 · facile</option><option value="1">1 · impegnativa</option><option value="0">0 · cedimento tecnico</option><option value="4+">4+ · troppo facile</option></select></div><button class="btn primary wide" onclick="finishSet()" style="margin-top:15px">✓ Completa serie ${a.set+1}</button></div>${last?`<div class="tip"><b>↗ Prepara la transizione</b><p>${next?`Dopo questa serie: <b>${esc(a.week<=4?next.name:next.alt)}</b> · ${next.sets} × ${next.reps}. ${esc(next.tip)}`:'È l’ultimo esercizio: seguirà il defaticamento facoltativo.'}</p></div>`:''}<button class="btn ghost wide" onclick="abandon()">Interrompi seduta</button>`}
function finishSet(){let a=state.active,e=days[a.day].ex[a.ex],kg=document.getElementById('kg').value.trim(),r=Number(document.getElementById('reps').value),rir=document.getElementById('rir').value;if(!kg||!Number.isFinite(r)||r<1||r>100){alert('Inserisci peso e ripetizioni valide. Se usi corpo libero, scrivi 0 come peso.');return}a.entries.push({exercise:blockEx(e),kg,reps:r,rir,day:a.day,week:a.week,at:new Date().toISOString()});state.loads[`${a.day}:${a.week<=4?'1':'2'}:${a.ex}`]=kg;let last=a.set===e.sets-1;let next=days[a.day].ex[a.ex+1];a.set++;if(last){a.ex++;a.set=0}if(a.ex>=days[a.day].ex.length){a.stage='cool';save();coolView();return}a.stage='rest';a.restEnd=Date.now()*1+e.rest*1000;a.transition=last;a.from=e.name;a.nextName=blockEx(next||days[a.day].ex[a.ex]);a.nextTip=next?.tip||'';save();restView()}
let ticker=null;function restView(){clearInterval(ticker);let a=state.active;if(!a||a.stage!=='rest')return;app.innerHTML=header(a.transition?'Recupero + spostamento':'Recupero tra le serie','Il recupero decorre dalla fine della serie appena completata.')+`<div class="card"><div class="timer" id="clock">--:--</div><p class="muted" style="text-align:center">${a.transition?'Puoi spostarti e preparare la macchina successiva.':'Respira e preparati per la prossima serie.'}</p>${a.transition?`<div class="tip"><div class="eyebrow">Prossimo esercizio</div><h2>${esc(a.nextName)}</h2><p>${esc(a.nextTip)}</p></div>`:`<div class="tip"><b>Prossima serie</b><p>${esc(blockEx(days[a.day].ex[a.ex]))} · serie ${a.set+1}</p></div>`}<div class="grid"><button class="btn" onclick="adjustRest(-15)">−15 sec</button><button class="btn" onclick="adjustRest(15)">+15 sec</button></div><button class="btn primary wide" id="ready" onclick="endRest()" style="margin-top:12px">Sono pronto · Continua →</button><p class="subtle" style="text-align:center">Il timer non forza il passaggio: puoi completare lo spostamento prima di continuare.</p></div>`;function update(){if(!state.active||state.active.stage!=='rest'){clearInterval(ticker);return}let sec=Math.max(0,Math.ceil((state.active.restEnd-Date.now())/1000));document.getElementById('clock').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(sec===0){document.getElementById('ready').textContent='Recupero terminato · Inizia quando sei pronto →';clearInterval(ticker)}}update();ticker=setInterval(update,400)}
function adjustRest(n){state.active.restEnd=Math.max(Date.now(),state.active.restEnd+n*1000);save();restView()}
function endRest(){clearInterval(ticker);state.active.stage='train';state.active.restEnd=null;save();trainView()}
function coolView(){let a=state.active,d=days[a.day];app.innerHTML=header('Allenamento completato!','Ottimo. Ora puoi fare qualche minuto di stretching leggero.')+`<div class="card"><h2>Stretching facoltativo · 3–5 min</h2><p class="subtle">Mantieni ogni posizione con una tensione lieve, senza dolore e senza rimbalzi. La flessibilità migliora con costanza, non forzando.</p>${d.cool.map(x=>`<div class="exercise"><strong>${esc(x[0])} · ${x[1]} s circa</strong><div class="small">${esc(x[2])}</div></div>`).join('')}<button class="btn primary wide" onclick="complete()">Salva allenamento ✓</button></div>`}
function complete(){let a=state.active;if(!a)return;spPauseOnFinish();state.records.push({date:new Date().toISOString(),day:a.day,week:a.week,started:a.started,entries:a.entries});state.active=null;save();app.innerHTML=header('Seduta salvata','Il diario conserva carichi e ripetizioni sul dispositivo.')+`<div class="card"><h2 class="check">✓ Allenamento registrato</h2><p>Hai registrato ${a.entries.length} serie allenanti.</p><button class="btn primary wide" onclick="home()">Torna al programma</button></div>`}
function abandon(){if(confirm('Interrompere e perdere le serie di questa seduta?')){spPauseOnFinish();state.active=null;clearInterval(ticker);save();home()}}
function historyView(){let list=[...state.records].reverse();app.innerHTML=header('Diario allenamenti','Progressi registrati localmente in questo browser.')+`<div class="row"><button class="btn" onclick="exportCSV()">Esporta CSV</button><button class="btn" onclick="exportJSON()">Backup JSON</button></div>`+(list.length?list.map((r,i)=>`<details class="card"><summary><b>${esc(r.day)} · ${new Date(r.date).toLocaleDateString('it-IT')}</b> <span class="muted">· sett. ${r.week} · ${r.entries.length} serie</span></summary>${r.entries.map(x=>`<div class="exercise"><strong>${esc(x.exercise)}</strong><div class="small">${esc(x.kg)} kg · ${x.reps} rip · RIR ${esc(x.rir)}</div></div>`).join('')}</details>`).join(''):`<div class="card">Nessuna seduta salvata. Completa il primo allenamento per iniziare il diario.</div>`)}
const measureMain=[['weight','Peso (kg)'],['height','Altezza (cm)'],['waist','Vita (cm)'],['chest','Torace (cm)'],['shoulders','Spalle (cm)'],['hips','Fianchi / glutei (cm)']];

function ageAt(birth,at=new Date()){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(birth||''))return null;
 const [y,m,d]=birth.split('-').map(Number),dob=new Date(y,m-1,d);
 if(dob.getFullYear()!==y||dob.getMonth()!==m-1||dob.getDate()!==d||dob>at)return null;
 let years=at.getFullYear()-y;
 if(at.getMonth()+1<m||(at.getMonth()+1===m&&at.getDate()<d))years--;
 return years>=0&&years<=120?years:null;
}

/* Spotify Premium: OAuth Authorization Code with PKCE; no client secret. */
const SPOTIFY_CLIENT_ID='e4bf48bde1f54dfeb8ebcaa7d9cc7b6c';
const SPOTIFY_REDIRECT='https://elrosbolger.github.io/V-Shape-Pro/';
const SPOTIFY_SCOPES='user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative';
const spStore='vshape_spotify_';
const spGet=k=>sessionStorage.getItem(spStore+k);
const spSet=(k,v)=>sessionStorage.setItem(spStore+k,String(v));
const spClear=()=>['access','refresh','expires','verifier','state'].forEach(k=>sessionStorage.removeItem(spStore+k));
const spEscape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let spMessage='';
let spCurrent=null;
let spDevices=[];
let spPlaylists=[];
let spTimer=null;
async function spLogin(){
 try{
  const verifier=Array.from(crypto.getRandomValues(new Uint8Array(64)),b=>('0'+b.toString(16)).slice(-2)).join('');
  const challengeBytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
  const challenge=btoa(String.fromCharCode(...new Uint8Array(challengeBytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const stateValue=crypto.randomUUID();
  spSet('verifier',verifier);spSet('state',stateValue);
  const params=new URLSearchParams({response_type:'code',client_id:SPOTIFY_CLIENT_ID,scope:SPOTIFY_SCOPES,redirect_uri:SPOTIFY_REDIRECT,state:stateValue,code_challenge_method:'S256',code_challenge:challenge});
  location.assign('https://accounts.spotify.com/authorize?'+params.toString());
 }catch(e){spMessage='Impossibile avviare Spotify: '+e.message;musicView()}
}
async function spToken(body){
 const res=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
 const data=await res.json();
 if(!res.ok)throw Error(data.error_description||data.error||'Autorizzazione Spotify non riuscita');
 spSet('access',data.access_token);spSet('expires',Date.now()+data.expires_in*1000);
 if(data.refresh_token)spSet('refresh',data.refresh_token);
 return data.access_token;
}
async function spAuthCallback(){
 const params=new URLSearchParams(location.search);
 if(!params.has('code')&&!params.has('error'))return false;
 history.replaceState({},'',location.pathname+location.hash);
 try{
  if(params.has('error'))throw Error(params.get('error'));
  if(params.get('state')!==spGet('state')||!spGet('verifier'))throw Error('Verifica di sicurezza non riuscita. Riprova il collegamento.');
  await spToken({grant_type:'authorization_code',code:params.get('code'),redirect_uri:SPOTIFY_REDIRECT,client_id:SPOTIFY_CLIENT_ID,code_verifier:spGet('verifier')});
  sessionStorage.removeItem(spStore+'verifier');sessionStorage.removeItem(spStore+'state');
  spMessage='Spotify collegato.';
 }catch(e){spMessage=e.message}
 musicView();if(spGet('access'))spLoad();
 return true;
}
async function spAccess(){
 if(!spGet('access'))throw Error('Collega prima Spotify.');
 if(Date.now()<Number(spGet('expires')||0)-60000)return spGet('access');
 if(!spGet('refresh'))throw Error('Sessione scaduta: ricollega Spotify.');
 return spToken({grant_type:'refresh_token',refresh_token:spGet('refresh'),client_id:SPOTIFY_CLIENT_ID});
}
async function spApi(path,method='GET',body){
 const token=await spAccess();
 const res=await fetch('https://api.spotify.com/v1/'+path,{method,headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
 if(res.status===204||res.status===202)return null;
 const data=await res.json().catch(()=>null);
 if(!res.ok)throw Error(data?.error?.message||('Spotify HTTP '+res.status));
 return data;
}
function spError(e){spMessage=e.message||String(e);musicView()}
async function spLoad(){
 if(!spGet('access')){spMessage='Collega Spotify per visualizzare musica e dispositivi.';musicView();return}
 const results=await Promise.allSettled([spApi('me/player'),spApi('me/player/devices'),spApi('me/playlists?limit=30')]);
 const [playback,devices,playlists]=results;
 if(playback.status==='fulfilled')spCurrent=playback.value;
 if(devices.status==='fulfilled')spDevices=devices.value?.devices||[];
 if(playlists.status==='fulfilled')spPlaylists=playlists.value?.items||[];
 const failures=results.map((v,i)=>v.status==='rejected'?['Riproduzione','Dispositivi','Playlist'][i]+': '+v.reason.message:null).filter(Boolean);
 spMessage=failures.length?'Spotify ha restituito un errore: '+failures.join(' · '):'';
 musicView();
}
async function spControl(path,method='PUT',body){

}
function spDevice(id){spControl('me/player','PUT',{device_ids:[id],play:false})}
async function spPlaylist(uri){
 try{
  let devices=spDevices;
  if(!devices.length){const data=await spApi('me/player/devices');devices=data?.devices||[];spDevices=devices}
  const target=devices.find(d=>d.is_active)||devices.find(d=>d.type==='Smartphone')||devices[0];
  if(!target?.id){spMessage='Apri Spotify sul Pixel e avvia una canzone una sola volta, poi torna qui e premi Aggiorna. Spotify non permette di avviare da remoto un telefono non rilevato.';musicView();return}
  await spApi('me/player/play?device_id='+encodeURIComponent(target.id),'PUT',{context_uri:uri});
  spMessage='Playlist avviata sul dispositivo '+target.name+'.';
  setTimeout(spLoad,600);
 }catch(e){spError(e)}
}

 '<h3 style="margin-top:20px">Le tue playlist</h3>'+(spPlaylists.length?spPlaylists.filter(p=>p&&p.uri).map(p=>'<div class="row spread" style="margin:8px 0"><span style="flex:1;min-width:0">'+spEscape(p.name)+'</span><button class="btn smallbtn" onclick="spPlaylist(\''+spEscape(p.uri)+'\')">▶</button></div>').join(''):'<p class="muted small">Nessuna playlist disponibile. Apri Spotify per avviare la musica, poi aggiorna.</p>')+
 '<p class="small muted">Tocca ▶ accanto a una playlist per avviarla sul Pixel o sul dispositivo Spotify Connect attivo. Se il telefono non compare, apri Spotify una volta per renderlo disponibile.</p><button class="btn primary wide" id="sp-exit-button" onclick="spPauseAndExit()">⏸ Pausa musica ed esci</button><p class="small muted">La chiusura forzata della PWA da Android non può essere rilevata in modo affidabile. Usa questo comando per fermare la musica.</p><button class="btn" onclick="spLogout()">Scollega Spotify</button>')+
 '</div><div class="card"><p>Per associare cuffie Bluetooth e regolare il volume generale, usa i controlli Android. Spotify Premium e le API determinano quali controlli remoti sono disponibili.</p><button class="btn wide" onclick="window.open(\'https://open.spotify.com/\',\'_blank\')">Apri Spotify</button></div>';
}


/* Update only the music screen; never interrupt exercise entry or rest timers. */
let spPolling=false;
let spLastSignature='';
function spSignature(){
 return JSON.stringify({
  track:spCurrent?.item?.id||null,
  playing:spCurrent?.is_playing??null,
  device:spCurrent?.device?.id||null,
  volume:spCurrent?.device?.volume_percent??null,
  devices:spDevices.map(d=>[d.id,d.is_active,d.volume_percent]),
  playlists:spPlaylists.map(p=>p?.id),
  message:spMessage
 });
}
function spEnsureAutoRefresh(){
 if(spTimer)return;
 spTimer=setInterval(spAutoRefresh,7000);
}
async function spAutoRefresh(){
 if(spPolling||document.hidden||!document.getElementById('spotify-panel')||!spGet('access'))return;
 if(document.activeElement?.matches('#spotify-panel input, #spotify-panel select'))return;
 spPolling=true;
 try{
  const results=await Promise.allSettled([spApi('me/player'),spApi('me/player/devices')]);
  if(results[0].status==='fulfilled')spCurrent=results[0].value;
  if(results[1].status==='fulfilled')spDevices=results[1].value?.devices||[];
  const next=spSignature();
  if(next!==spLastSignature){
   spLastSignature=next;
   const position=window.scrollY;
   musicView();
   window.scrollTo(0,position);
  }
 }catch(e){/* Keep the current player visible if Spotify is temporarily unreachable. */}
 finally{spPolling=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)spAutoRefresh()});
/* Spotify availability prompt: API reports devices, not whether Android app is closed. */
let spPromptDismissed=false;
function spPromptClose(){spPromptDismissed=true;document.getElementById('sp-start-prompt')?.remove()}
function spPromptOpenSpotify(){spPromptClose();window.location.href='https://open.spotify.com/'}
function spShowStartupPrompt(){
 if(spPromptDismissed||document.getElementById('sp-start-prompt'))return;
 const overlay=document.createElement('div');overlay.id='sp-start-prompt';
 overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:#020813c9;display:flex;align-items:center;justify-content:center;padding:20px';
 overlay.innerHTML='<div role="dialog" aria-modal="true" aria-labelledby="sp-prompt-title" style="background:#172438;border:1px solid #31445d;border-radius:20px;padding:22px;width:100%;max-width:400px;box-shadow:0 16px 60px #0008"><h2 id="sp-prompt-title">🎧 Spotify non disponibile</h2><p>Non rilevo dispositivi Spotify Connect attivi. Apri Spotify sul telefono e avvia un brano per poter controllare la musica da V-Shape Pro.</p><button class="btn primary wide" onclick="spPromptOpenSpotify()">Apri Spotify</button><button class="btn ghost wide" style="margin-top:10px" onclick="spPromptClose()">Continua senza musica</button></div>';
 document.body.appendChild(overlay);
}
async function spCheckAtStartup(){
 if(!spGet('access')||spPromptDismissed)return;
 try{
  const data=await spApi('me/player/devices');
  if(!data?.devices?.length)spShowStartupPrompt();
 }catch(e){/* Don't interrupt workouts on API, connectivity, or authorization errors. */}
}

spAuthCallback().then(handled=>{if(!handled)home();spCheckAtStartup()});
